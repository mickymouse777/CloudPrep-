services:
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - function
  function:
    build:
      context: .
      dockerfile: FunctionService/Dockerfile
